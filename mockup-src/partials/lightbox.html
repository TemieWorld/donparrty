<dialog class="lb-dlg" id="lb" aria-label="Photo"><div style="position:relative;width:100%;height:100%;overflow:hidden">
<div class="v-m" style="position:relative;max-width:600px;height:100%;margin:0 auto;background:#000">
<div style="position:absolute;top:0;left:0;right:0;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 16px"><span data-lb="count" style="font:500 12px 'JetBrains Mono';color:#B9C1BC"></span><button type="button" data-lb="close" aria-label="Fermer" style="width:44px;height:44px;background:none;border:1px solid #2c312e;border-radius:50%;color:#F2F5F3;font-size:16px">✕</button></div>
<div data-lb="photo" style="position:absolute;left:0;right:0;top:100px;bottom:210px;max-height:470px;background:repeating-linear-gradient(135deg,#141615 0 10px,#1a1d1b 10px 20px);display:flex;align-items:center;justify-content:center;font:500 11px 'JetBrains Mono';color:#8A938E"></div>
<button type="button" data-lb="prev" aria-label="Photo précédente" style="position:absolute;left:8px;top:calc(50% - 60px);width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.55);border:0;color:#F2F5F3;font-size:18px">‹</button>
<button type="button" data-lb="next" aria-label="Photo suivante" style="position:absolute;right:8px;top:calc(50% - 60px);width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.55);border:0;color:#F2F5F3;font-size:18px">›</button>
<div style="position:absolute;left:16px;right:16px;bottom:28px;display:flex;flex-direction:column;gap:14px">

<button type="button" class="heart-b" data-lb="heart" aria-pressed="false" style="height:52px;padding:0 18px;border-radius:999px;border:1px solid #2c312e;background:rgba(17,19,18,.8);color:#F2F5F3;font:600 15px 'Space Grotesk';display:flex;align-items:center;gap:8px">💚 <span data-lb="hn"></span></button></div>

<div style="font:400 11px 'JetBrains Mono';color:#5c635f">swipe ← → · swipe ↓ to close</div></div></div>
<div class="v-d" style="position:relative;height:100%;min-height:700px;background:rgba(0,0,0,.94)">

<button type="button" data-lb="close" aria-label="Fermer" style="position:absolute;top:16px;right:24px;width:48px;height:48px;border-radius:50%;border:1px solid #2c312e;background:none;color:#F2F5F3;font-size:18px">✕</button>
<div data-lb="photo" style="position:absolute;left:50%;top:80px;width:520px;height:calc(100% - 200px);max-height:620px;margin-left:-260px;background:repeating-linear-gradient(135deg,#141615 0 10px,#1a1d1b 10px 20px);display:flex;align-items:center;justify-content:center;font:500 11px 'JetBrains Mono';color:#8A938E"></div>
<button type="button" data-lb="prev" aria-label="Photo précédente" style="position:absolute;left:40px;top:calc(50% - 28px);width:56px;height:56px;border-radius:50%;border:1px solid #2c312e;background:none;color:#F2F5F3;font-size:22px">‹</button>
<button type="button" data-lb="next" aria-label="Photo suivante" style="position:absolute;right:40px;top:calc(50% - 28px);width:56px;height:56px;border-radius:50%;border:1px solid #2c312e;background:none;color:#F2F5F3;font-size:22px">›</button>
<div style="position:absolute;left:0;right:0;bottom:28px;display:flex;justify-content:center"><div style="display:flex;align-items:center;gap:28px;background:#111312;border:1px solid #222624;border-radius:999px;padding:8px 8px 8px 20px"><span data-lb="credit" style="font:500 14px 'Space Grotesk';white-space:nowrap"></span><span style="width:1px;height:24px;background:#2c312e"></span><a href="#" data-lb="td" data-takedown style="font:400 13px 'Space Grotesk';color:#D5DBD7;text-decoration:underline;white-space:nowrap">Demande de retrait</a><button type="button" class="heart-b" data-lb="heart" aria-pressed="false" style="height:48px;padding:0 20px;border-radius:999px;border:1px solid #2c312e;background:rgba(17,19,18,.8);color:#F2F5F3;font:600 15px 'Space Grotesk';display:flex;align-items:center;gap:8px;white-space:nowrap">💚 <span data-lb="hn"></span></button></div></div>
